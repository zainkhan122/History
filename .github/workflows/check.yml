# Repo hygiene on every push: code compiles, shell parses, and NO media/bloat sneaks into git.
name: check
on:
  push:
  pull_request:
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python compiles
        run: python3 -m compileall -q reelkit series tools
      - name: Shell parses
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Size guard
        run: python3 tools/repo_guard.py
      - name: Claims ledgers (every episode's narration ↔ research.json, guardrails, evidence tiers)
        run: |
          set -e
          for t in $(git ls-files 'series/*/*/timeline.json'); do
            ep=$(dirname "$t"); echo "== $ep"; python3 reelkit/factcheck.py "$ep" --hf /nonexistent
          done
      - name: Voice performance plans (tones, pauses, arc; timeline uses the plan's pauses)
        run: |
          set -e
          for v in $(git ls-files 'series/*/*/voice.json'); do
            ep=$(dirname "$v"); echo "== $ep"; python3 reelkit/voice.py check "$ep" --plan-only
          done
      - name: Provenance + plan lint (licences, credits, promise/exceptions, series template drift)
        run: |
          set -e
          for sh in $(git ls-files 'series/*/*/shots.json'); do
            ep=$(dirname "$sh"); echo "== $ep"
            python3 reelkit/provenance.py "$ep" --hf /nonexistent
            python3 reelkit/planlint.py "$ep" --hf /nonexistent
          done
      - name: Motion clips (5-slot Wan template, seeds, cache index ↔ release assets)
        run: |
          set -e
          for c in $(git ls-files 'series/*/*/clips.json'); do
            ep=$(dirname "$c"); echo "== $ep"; python3 reelkit/clips.py lint "$ep"
          done
          python3 reelkit/clipcache.py verify --remote
